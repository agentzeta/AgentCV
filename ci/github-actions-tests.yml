# GitHub Actions test workflow, parked here because GitHub cannot start jobs while the
# agentzeta account has a billing lock (every run failed with "The job was not started because
# your account is locked due to a billing issue"; no test ever ran or failed).
# To re-enable once billing is resolved:  git mv ci/github-actions-tests.yml .github/workflows/ci.yml
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix frontend
      - run: npm run build:frontend
